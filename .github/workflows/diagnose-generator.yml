name: Diagnose image/video generator (read-only)

# 왜 (회장 2026-09-06 "인스타그램 유튜브 디버깅은 니가 알아서해야지" + 생성기 승인):
#   생성기가 배포 컨테이너 안에서 실제로 인증되어 있는지는 화면 로그인 없이 확인할 길이 없었다.
#   이 워크플로는 배포 러너에서 컨테이너 안의 생성기 상태만 읽어 온다.
#
# 안전장치
#   - 읽기 전용이다. 생성을 실행하지 않는다(돈이 나가는 호출 금지).
#   - 자격증명 값을 출력하지 않는다. 계정 상태 한 줄과 잔여 크레딧만 본다.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: [self-hosted, marketing_runner]
    steps:
      - name: 컨테이너 안 생성기 상태
        run: |
          for c in $(docker ps --format '{{.Names}}' | grep -i osmu); do
            echo "::group::$c"
            echo "-- 실행 파일 --"
            docker exec "$c" sh -lc 'command -v higgsfield || echo "실행 파일 없음"' 2>&1 | tail -3
            echo "-- 자격증명 파일 --"
            docker exec "$c" sh -lc 'ls -l /root/.config/higgsfield 2>&1 | sed -E "s/[0-9]{4}-[0-9]{2}-[0-9]{2}//"' 2>&1 | tail -6
            echo "-- 계정 상태 --"
            docker exec "$c" sh -lc 'higgsfield account status 2>&1 | head -3' 2>&1 \
              | sed -E 's/(ya29|eyJ)[A-Za-z0-9_.\-]+/[가림]/g' | tail -5
            echo "::endgroup::"
          done
