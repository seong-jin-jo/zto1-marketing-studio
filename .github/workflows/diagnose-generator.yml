name: Diagnose image/video generator (read-only)

# 운영 생성기 장애를 DNS, TLS/HTTP, proxy, CLI, credential metadata, 앱 분기로 나눠 본다.
# 생성·로그인·자격증명 덮어쓰기는 하지 않으며 token 없는 요청과 읽기만 수행한다.
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: [self-hosted, marketing_runner]
    timeout-minutes: 5
    steps:
      - name: 컨테이너 안 생성기 네트워크·세션 진단
        run: |
          redact() {
            sed -E \
              -e 's/"extra":"[^"]*"/"extra":"[REDACTED]"/g' \
              -e 's/(Bearer[[:space:]]+)[A-Za-z0-9._~+\/-]+/\1[REDACTED]/ig' \
              -e 's/(ya29|eyJ)[A-Za-z0-9_.\-]+/[REDACTED]/g' \
              -e 's/([A-Za-z0-9._%+-]+)@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[REDACTED_EMAIL]/g' \
              -e 's/((access|refresh|id)[_-]?token|authorization|secret|password|cookie|api[_-]?key)(["[:space:]]*[:=]["[:space:]]*)[^,"[:space:]]+/\1\3[REDACTED]/ig' \
              -e 's/([?&](access_token|refresh_token|token|key|secret)=)[^&[:space:]]+/\1[REDACTED]/ig'
          }

          containers="$(docker ps --format '{{.Names}}' | grep -i osmu || true)"
          if [ -z "$containers" ]; then
            echo "::error::OSMU 컨테이너가 실행 중이 아님"
            exit 1
          fi

          for c in $containers; do
            echo "::group::$c"
            echo "-- 실행 파일과 CLI 버전 --"
            docker exec "$c" sh -lc 'command -v higgsfield || echo "실행 파일 없음"' 2>&1 | tail -3
            docker exec "$c" sh -lc 'higgsfield --version 2>&1 | head -1' 2>&1 | redact

            echo "-- DNS 해석: fnf-api-gw.higgsfield.ai --"
            if dns_result="$(docker exec "$c" getent ahosts fnf-api-gw.higgsfield.ai 2>&1)"; then
              printf '%s\n' "$dns_result" | awk '!seen[$1]++ { print $1, $2, $3 }' | head -6 | redact
              echo "dns_exit=0"
            else
              dns_status=$?
              printf '%s\n' "$dns_result" | redact | tail -5
              echo "dns_exit=$dns_status"
            fi

            echo "-- token 없는 HTTPS 연결 --"
            if https_result="$(docker exec "$c" sh -lc \
              'curl -sS -o /dev/null --connect-timeout 10 --max-time 20 \
                -w "dns=%{time_namelookup}s tcp=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s http_code=%{http_code} ssl_verify=%{ssl_verify_result}\\n" \
                https://fnf-api-gw.higgsfield.ai/' 2>&1)"; then
              printf '%s\n' "$https_result" | redact
              echo "https_exit=0"
            else
              https_status=$?
              printf '%s\n' "$https_result" | redact
              echo "https_exit=$https_status"
            fi

            echo "-- proxy 변수 존재 여부(값 비노출) --"
            docker exec "$c" sh -lc '
              for name in HTTP_PROXY HTTPS_PROXY NO_PROXY http_proxy https_proxy no_proxy; do
                value="$(eval "printf %s \"\${$name-}\"")"
                if [ -n "$value" ]; then
                  echo "$name=[SET:value-masked]"
                else
                  echo "$name=[UNSET]"
                fi
              done
            '

            echo "-- 자격증명 metadata(값 비노출) --"
            docker exec "$c" sh -lc \
              'stat -c "credentials_mtime=%y size=%s" /root/.config/higgsfield/credentials.json 2>&1 | head -1' \
              2>&1 | redact
            docker exec "$c" node -e '
              const fs = require("fs");
              try {
                const data = JSON.parse(fs.readFileSync("/root/.config/higgsfield/credentials.json", "utf8"));
                const raw = data.expires_at;
                let milliseconds = typeof raw === "number" ? raw : Number(raw);
                if (Number.isFinite(milliseconds) && milliseconds < 1000000000000) milliseconds *= 1000;
                if (!Number.isFinite(milliseconds)) milliseconds = Date.parse(String(raw || ""));
                if (!Number.isFinite(milliseconds)) throw new Error("missing expiry");
                console.log(`expires_at=${new Date(milliseconds).toISOString()} expired=${milliseconds <= Date.now()}`);
              } catch {
                console.log("expires_at=unavailable expired=unknown");
                process.exitCode = 1;
              }
            ' 2>&1 | redact

            echo "-- 계정 API 상태(출력 마스킹) --"
            if account_result="$(docker exec "$c" timeout 30s higgsfield account status 2>&1)"; then
              printf '%s\n' "$account_result" | redact | head -5
              echo "account_status_exit=0"
            else
              account_status=$?
              printf '%s\n' "$account_result" | redact | head -5
              echo "account_status_exit=$account_status"
            fi

            echo "-- 최근 30분 /api/higgsfield/image 503 분기 로그(마스킹) --"
            matching_logs="$(docker logs --since 30m "$c" 2>&1 \
              | grep -E 'hf_image_step|/api/higgsfield/image|GENERATOR_UNAUTHENTICATED|GENERATOR_UNAVAILABLE|HTTP[^[:digit:]]*503|status[^[:digit:]]*503' \
              | tail -200 || true)"
            if [ -n "$matching_logs" ]; then
              printf '%s\n' "$matching_logs" | redact
            else
              echo "matching_logs=0"
            fi
            echo "::endgroup::"
          done
