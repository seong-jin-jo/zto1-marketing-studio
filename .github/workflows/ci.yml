name: CI (dashboard)

# repo-root에 둬야 GitHub가 읽음(dashboard/.github/는 무시됨). dashboard/** 변경 PR·push:main 게이트.
# self-hosted runner에서 node:20 컨테이너 + postgres 서비스로 실행 → 격리 테스트가 실제 assert(skip 아님).
on:
  push:
    branches: [main]
    paths: ['dashboard/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['dashboard/**', '.github/workflows/ci.yml']

# 같은 ref의 이전 CI는 취소. (deploy 워크플로는 건드리지 않음 — 단일 marketing_runner가 잡을 자연 직렬화)
concurrency:
  group: osmu-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: _ci/src/dashboard

jobs:
  verify:
    runs-on: [self-hosted, marketing_runner]
    container:
      image: node:20-bookworm
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 컨테이너 잡이라 서비스는 docker 네트워크에서 서비스명(postgres)으로 도달.
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/testdb
    steps:
      # 운영 compose도 같은 GITHUB_WORKSPACE 루트를 쓴다. checkout의 기본 clean은
      # 저장소 루트가 아니라 이 하위 소스 폴더에서만 실행돼야 한다.
      - uses: actions/checkout@v4
        with:
          path: _ci/src

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: _ci/src/dashboard/package-lock.json

      - run: npm ci

      - name: Seed proper-lockfile into the openclaw tree
        # tests/publish/cancel-safety-regression 등 8개가 openclaw/extensions/threads-queue 의
        # queue-lock 을 원본 그대로 부른다. 그 파일은 proper-lockfile 을 자기 트리(openclaw/node_modules)
        # 에서 찾는데 CI 는 대시보드만 설치해 없다(2026-09-15 실측: Cannot find module './lib/lockfile').
        # 심볼릭 링크는 vitest 가 realpath 로 풀어 tests/setup.ts 의 proper-lockfile mock 과 같은
        # 모듈로 합쳐 버리고, 그러면 진짜 자물쇠를 검사하는 테스트가 무너진다. 그래서 복사한다.
        # 로컬은 pnpm 이 별도 실체를 두므로 같은 조건이다.
        working-directory: ${{ github.workspace }}/_ci/src
        run: |
          mkdir -p openclaw/node_modules
          for m in proper-lockfile graceful-fs retry signal-exit; do
            cp -R "dashboard/node_modules/$m" "openclaw/node_modules/$m"
          done

      - name: Type check
        # CI 는 대시보드 의존성만 설치한다. 이웃 워크스페이스(openclaw)를 직접 부르는
        # 테스트 아홉 개는 그 트리의 의존성이 없어 여기서 무너진다(2026-09-14 실측 11건).
        # 그 트리 node_modules 가 2.2GB 라 CI 에 설치하는 것은 값이 안 맞는다.
        # 설치한 범위만 검사하고 사유는 tsconfig.ci.json 주석에 적었다.
        run: npx tsc --noEmit -p tsconfig.ci.json

      - name: Build
        env:
          CARD_DECK_V3_RENDER_ENABLED: "1"
          NEXT_PUBLIC_CARD_DECK_V3_RENDER_ENABLED: "1"
        run: npm run build   # NEXT_PUBLIC_SUPABASE_* 미설정도 빌드 OK(런타임만 영향)

      - name: Install psql client
        run: apt-get update && apt-get install -y --no-install-recommends postgresql-client

      - name: Install Remotion render runtime (ffmpeg + headless Chrome libs)
        # tests/intro-outro-render.integration.test.ts 가 실제 Remotion 렌더 + ffmpeg concat 을
        # 돈다. node:20-bookworm 컨테이너엔 Chrome headless shell 이 링크하는 시스템 라이브러리
        # (libnspr4 등)와 ffmpeg 가 없어 브라우저 실행이 127 로 죽었다(2026-10-03 CI 실측).
        # 운영 이미지(dashboard/Dockerfile runner 단계)와 같은 목록을 깐다.
        run: |
          apt-get install -y --no-install-recommends \
            ffmpeg fonts-noto-cjk \
            libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 \
            libasound2 libpango-1.0-0 libcairo2 libgtk-3-0 fonts-liberation

      - name: "Apply schema → seed → rls (순서 중요 — seed가 FORCE RLS 전)"
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/seed-test-tenants.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/rls.sql

      - name: Generation S1/S2/S3 migration concurrency matrix
        run: bash scripts/verify-generation-migration-matrix.sh

      - name: Test (격리 테스트가 DB 연결로 실제 assert)
        run: npx vitest run

      - name: 발행실 카드 정렬 실측 게이트 (헤드리스 브라우저)
        # 2026-09-23 실수 원장 count:9 봉합. 이 측정 스크립트는 그전까지 package.json 에
        # 등록만 돼 있고 어디서도 호출되지 않는 죽은 코드였다 — 그래서 정렬 회귀를
        # 다섯 라운드 동안 아무도 못 잡았다. 이제 CI 의 실제 스텝이다.
        # 브라우저를 못 구하면 조용히 건너뛰지 않고 실패한다(스크립트 안에 명시).
        run: bash scripts/ci-publish-room-alignment.sh

      - name: 말풍선 에디터 WYSIWYG 회귀 게이트 (chromium)
        # PR #85 4차 재검증 MINOR(4). webkit·firefox 는 CI(self-hosted 러너 반복 실행)에
        # 매번 설치하기엔 브라우저 바이너리 값이 커서, chromium만 CI 게이트로 걸고 나머지
        # 두 엔진은 로컬에서 수동으로 3엔진 전체(`npm run e2e:bubble-editor`)를 돌려
        # 확인한다(이번 라운드 확인 로그: 27/27 통과, chromium/webkit/firefox 전부).
        # 이 스텝은 MAJOR(끝 개행 WYSIWYG 불일치)·MINOR(선행 Enter, 키보드 전용 굵게)
        # 회귀를 실측 브라우저로 잡는다 — mock/jsdom으로는 못 잡는 축이다.
        # MINOR(3, 5차 재검증): `npx playwright install`은 package.json에 없는
        # `playwright`(풀 패키지)를 매번 최신판(예: 1.63)으로 새로 받아 브라우저 버전이
        # 고정 안 된다 — 이 레포는 `playwright-core`만 devDependency로 쓴다(스크립트가
        # 실제 임포트하는 것도 그것). `npx playwright-core install`로 바꿔 이미 npm ci로
        # 설치된, package-lock.json이 고정한 그 버전의 브라우저를 받는다.
        run: |
          npx playwright-core install --with-deps chromium
          npm run e2e:bubble-editor:chromium

      - name: 편집실 v70 화면 정합 회귀 게이트 (일반 카드·말풍선 덱·발행실)
        timeout-minutes: 4
        env:
          STUDIO_V70_BASE_URL: http://127.0.0.1:3472
          STUDIO_V70_OUTPUT_DIR: /tmp/studio-v70-screen-conformance
          # 화면별 v70 clean-frame을 저장소 상대경로로 읽고 카드 면만 잘라 이미지 차이를
          # 판정한다. 바깥 제품 셸 차이는 비교 대상이 아니다.
          STUDIO_V70_COMPARE: "1"
        run: |
          npm run start -- -p 3472 > /tmp/studio-v70-dev.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true' EXIT
          timeout --kill-after=5s 60s bash -c 'until curl -fsS http://127.0.0.1:3472/studio >/dev/null; do sleep 1; done'
          timeout --kill-after=10s 150s npm run e2e:studio-v70-screen

      - name: 회장 결함 생성→편집→발행 통합 회귀 게이트
        timeout-minutes: 4
        env:
          CARD_DECK_V3_RENDER_ENABLED: "1"
          NEXT_PUBLIC_CARD_DECK_V3_RENDER_ENABLED: "1"
          CHAIRMAN_FIX_BASE_URL: http://127.0.0.1:3473
          CHAIRMAN_FIX_OUTPUT_DIR: /tmp/editroom-chairman-fix
        run: |
          npm run start -- -p 3473 > /tmp/editroom-chairman-fix-dev.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true' EXIT
          timeout --kill-after=5s 60s bash -c 'until curl -fsS http://127.0.0.1:3473/studio >/dev/null; do sleep 1; done'
          timeout --kill-after=10s 150s npm run e2e:chairman-defects

      - name: 편집실 본문 충돌 복구 두 탭 회귀 게이트 (chromium)
        timeout-minutes: 3
        run: |
          npm run start -- -p 3471 > /tmp/body-conflict-dev.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true' EXIT
          timeout --kill-after=5s 60s bash -c 'until curl -fsS http://127.0.0.1:3471/studio >/dev/null; do sleep 1; done'
          timeout --kill-after=10s 90s npm run e2e:body-conflict
