name: CI (dashboard)

# repo-root에 둬야 GitHub가 읽음(dashboard/.github/는 무시됨). dashboard/** 변경 PR·push:main 게이트.
# self-hosted runner에서 node:20 컨테이너 + postgres 서비스로 실행 → 격리 테스트가 실제 assert(skip 아님).
on:
  push:
    branches: [main]
    paths: ['dashboard/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['dashboard/**', '.github/workflows/ci.yml']

# 같은 ref의 이전 CI는 취소. (deploy 워크플로는 건드리지 않음 — 단일 marketing_runner가 잡을 자연 직렬화)
concurrency:
  group: osmu-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: dashboard

jobs:
  verify:
    runs-on: [self-hosted, marketing_runner]
    container:
      image: node:20-bookworm
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 컨테이너 잡이라 서비스는 docker 네트워크에서 서비스명(postgres)으로 도달.
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/testdb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci

      - name: Seed proper-lockfile into the openclaw tree
        # tests/publish/cancel-safety-regression 등 8개가 openclaw/extensions/threads-queue 의
        # queue-lock 을 원본 그대로 부른다. 그 파일은 proper-lockfile 을 자기 트리(openclaw/node_modules)
        # 에서 찾는데 CI 는 대시보드만 설치해 없다(2026-09-15 실측: Cannot find module './lib/lockfile').
        # 심볼릭 링크는 vitest 가 realpath 로 풀어 tests/setup.ts 의 proper-lockfile mock 과 같은
        # 모듈로 합쳐 버리고, 그러면 진짜 자물쇠를 검사하는 테스트가 무너진다. 그래서 복사한다.
        # 로컬은 pnpm 이 별도 실체를 두므로 같은 조건이다.
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p openclaw/node_modules
          for m in proper-lockfile graceful-fs retry signal-exit; do
            cp -R "dashboard/node_modules/$m" "openclaw/node_modules/$m"
          done

      - name: Type check
        # CI 는 대시보드 의존성만 설치한다. 이웃 워크스페이스(openclaw)를 직접 부르는
        # 테스트 아홉 개는 그 트리의 의존성이 없어 여기서 무너진다(2026-09-14 실측 11건).
        # 그 트리 node_modules 가 2.2GB 라 CI 에 설치하는 것은 값이 안 맞는다.
        # 설치한 범위만 검사하고 사유는 tsconfig.ci.json 주석에 적었다.
        run: npx tsc --noEmit -p tsconfig.ci.json

      - name: Build
        run: npm run build   # NEXT_PUBLIC_SUPABASE_* 미설정도 빌드 OK(런타임만 영향)

      - name: Install psql client
        run: apt-get update && apt-get install -y --no-install-recommends postgresql-client

      - name: "Apply schema → seed → rls (순서 중요 — seed가 FORCE RLS 전)"
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/seed-test-tenants.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/rls.sql

      - name: Generation S1/S2/S3 migration concurrency matrix
        run: bash scripts/verify-generation-migration-matrix.sh

      - name: Test (격리 테스트가 DB 연결로 실제 assert)
        run: npx vitest run
