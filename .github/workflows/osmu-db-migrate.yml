name: OSMU approved DB migration
on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Explicit migration or rollback phase'
        required: true
        type: choice
        options:
          - audit
          - preflight
          - baseline
          - apply-legacy
          - expand-fk
          - expand-guard
          - expand-member
          - prepare-rollback
          - expand-export-queue
          - contract-generation
          - rollback-generation
          - rollback-quota
          - cleanup
      previous_compatible_image_digest:
        description: 'Observed previous compatible image digest for rollback'
        required: false
        type: string
      previous_compatible_image_ref:
        description: 'Pullable registry ref for previous image, or blank to use a preserved stopped OSMU container'
        required: false
        type: string
      rollback_manifest_run_id:
        description: 'Contract-generation run ID whose rollback artifact must be reused'
        required: false
        type: string

permissions:
  actions: read
concurrency:
  group: osmu-approved-db-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: [self-hosted, marketing_runner]
    environment: osmu-db-migration-approval
    env:
      SOURCE_DIR: ${{ github.workspace }}/source-migration
    defaults:
      run:
        working-directory: ${{ github.workspace }}/source-migration
    steps:
      - name: Prepare isolated checkout directory
        working-directory: ${{ github.workspace }}
        env:
          CHECKOUT_DIR: ${{ github.workspace }}/source-migration
        run: |
          if ! mkdir -p "$CHECKOUT_DIR"; then
            echo "::error::runner cannot create the isolated migration checkout directory"
            stat -c 'workspace owner=%U group=%G mode=%a' "$GITHUB_WORKSPACE" || true
            stat -c '_ci owner=%U group=%G mode=%a' "$GITHUB_WORKSPACE/_ci" || true
            exit 1
          fi
      # actions/checkout의 path는 GITHUB_WORKSPACE 아래 상대경로이고, clean: true는
      # 그 checkout 저장소에서 git clean -ffdx && git reset --hard HEAD를 실행한다.
      # https://github.com/actions/checkout/blob/main/README.md#usage
      # 운영 migration run 35772965580에서 성공한 root child 패턴을 고정 경로로 재사용한다.
      # 위 concurrency가 migration 실행을 직렬화하고, config-tenantN/data-tenantN은
      # checkout 저장소의 형제라 clean 대상 밖이다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: source-migration
          clean: true
      - name: Observe and verify every running compatibility image
        id: app
        # audit 와 preflight 는 읽기 전용이고, baseline 부터 expand-guard 및 export queue는 DDL 이
        # 앱 동작과 호환되는 방향(추가 전용)이라 실행 중 이미지 관측을 요구하지 않는다.
        # 이 목록에 expand-guard 가 들어 있는 것이 배포와 마이그레이션의 교착을 푸는 지점이다.
        if: ${{ !contains(fromJSON('["audit","preflight","baseline","apply-legacy","expand-fk","expand-guard","expand-export-queue"]'), inputs.phase) }}
        env:
          COMPATIBILITY_BASE_COMMIT: 9b72c05bf7ab2ff30ec4a669267ee3133ff71db4
        run: |
          mapfile -t containers < <(docker ps --filter label=com.docker.compose.service=openclaw-dashboard-osmu --format '{{.ID}}')
          [ "${#containers[@]}" -gt 0 ] || { echo "::error::no running OSMU app instance"; exit 1; }
          expected_digest=""
          expected_commit=""
          for container in "${containers[@]}"; do
            image_digest="$(docker container inspect --format '{{.Image}}' "$container")"
            app_commit="$(docker container inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$container")"
            [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::running image digest is not observable"; exit 1; }
            [[ "$app_commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::running app commit label is not observable"; exit 1; }
            git merge-base --is-ancestor "$COMPATIBILITY_BASE_COMMIT" "$app_commit" \
              || { echo "::error::running app predates compatibility release"; exit 1; }
            [ -z "$expected_digest" ] && expected_digest="$image_digest" && expected_commit="$app_commit"
            [ "$image_digest" = "$expected_digest" ] && [ "$app_commit" = "$expected_commit" ] \
              || { echo "::error::OSMU instances do not run one verified image"; exit 1; }
          done
          echo "image_digest=$expected_digest" >> "$GITHUB_OUTPUT"
          echo "app_commit=$expected_commit" >> "$GITHUB_OUTPUT"
      - name: Observe and verify the previous compatibility image
        id: previous
        if: ${{ inputs.phase == 'contract-generation' }}
        env:
          REQUESTED_PREVIOUS_DIGEST: ${{ inputs.previous_compatible_image_digest }}
          PREVIOUS_IMAGE_REF: ${{ inputs.previous_compatible_image_ref }}
          COMPATIBILITY_BASE_COMMIT: 9b72c05bf7ab2ff30ec4a669267ee3133ff71db4
        run: |
          [[ "$REQUESTED_PREVIOUS_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::previous compatible image digest is required"; exit 1; }
          image_source=""
          if [ -n "$PREVIOUS_IMAGE_REF" ]; then
            docker pull "$PREVIOUS_IMAGE_REF"
            image_source="$PREVIOUS_IMAGE_REF"
          else
            while IFS= read -r container; do
              [ "$(docker container inspect --format '{{.State.Running}}' "$container")" = "false" ] || continue
              [ "$(docker container inspect --format '{{.Image}}' "$container")" = "$REQUESTED_PREVIOUS_DIGEST" ] || continue
              image_source="$REQUESTED_PREVIOUS_DIGEST"
              break
            done < <(docker ps -aq --filter label=com.docker.compose.service=openclaw-dashboard-osmu)
          fi
          [ -n "$image_source" ] || { echo "::error::previous image is neither pullable nor preserved by a stopped OSMU container"; exit 1; }
          observed_digest="$(docker image inspect --format '{{.Id}}' "$image_source")"
          [ "$observed_digest" = "$REQUESTED_PREVIOUS_DIGEST" ] \
            || { echo "::error::previous image digest does not match the observed image"; exit 1; }
          previous_commit="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image_source")"
          [[ "$previous_commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::previous image commit label is missing"; exit 1; }
          git merge-base --is-ancestor "$COMPATIBILITY_BASE_COMMIT" "$previous_commit" \
            || { echo "::error::previous image predates the compatibility release"; exit 1; }
          probe="$(docker create --entrypoint /bin/true "$image_source")"
          docker rm "$probe" >/dev/null
          echo "image_digest=$observed_digest" >> "$GITHUB_OUTPUT"
          echo "app_commit=$previous_commit" >> "$GITHUB_OUTPUT"
      - name: Build rollback manifest from observed pre-contract state
        id: rollback
        if: ${{ inputs.phase == 'contract-generation' }}
        env:
          OSMU_DATABASE_URL: ${{ secrets.OSMU_DATABASE_URL }}
          VERIFIED_APP_IMAGE_DIGEST: ${{ steps.app.outputs.image_digest }}
          VERIFIED_APP_COMMIT: ${{ steps.app.outputs.app_commit }}
          PREVIOUS_COMPATIBLE_IMAGE_DIGEST: ${{ steps.previous.outputs.image_digest }}
        run: |
          export ROLLBACK_DEADLINE_UTC="$(date -u -d '+7 days' '+%Y-%m-%dT%H:%M:%SZ')"
          docker run --rm \
            -e OSMU_DATABASE_URL \
            -e VERIFIED_APP_IMAGE_DIGEST \
            -e VERIFIED_APP_COMMIT \
            -e PREVIOUS_COMPATIBLE_IMAGE_DIGEST \
            -e ROLLBACK_DEADLINE_UTC \
            -v "$SOURCE_DIR/dashboard/db":/db:ro \
            -v "$RUNNER_TEMP":/runner-temp \
            postgres:16 \
            bash /db/write-rollback-manifest.sh /runner-temp/osmu-rollback-manifest.json
          manifest_sha="$(sha256sum "$RUNNER_TEMP/osmu-rollback-manifest.json" | awk '{print $1}')"
          echo "path=$RUNNER_TEMP/osmu-rollback-manifest.json" >> "$GITHUB_OUTPUT"
          echo "sha256=$manifest_sha" >> "$GITHUB_OUTPUT"
      - name: Download the original rollback manifest
        id: prior
        if: ${{ contains(fromJSON('["rollback-generation","rollback-quota","cleanup"]'), inputs.phase) }}
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_RUN_ID: ${{ inputs.rollback_manifest_run_id }}
        run: |
          [[ "$MANIFEST_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::rollback manifest run ID is required"; exit 1; }
          mkdir -p "$RUNNER_TEMP/prior-rollback"
          gh run download "$MANIFEST_RUN_ID" \
            --name "osmu-db-rollback-manifest-$MANIFEST_RUN_ID" \
            --dir "$RUNNER_TEMP/prior-rollback"
          manifest_path="$RUNNER_TEMP/prior-rollback/osmu-rollback-manifest.json"
          [ -f "$manifest_path" ] || { echo "::error::rollback manifest artifact missing"; exit 1; }
          echo "path=$manifest_path" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$manifest_path" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.phase == 'contract-generation' }}
        with:
          name: osmu-db-rollback-manifest-${{ github.run_id }}
          path: ${{ steps.rollback.outputs.path }}
          retention-days: 14
      - name: Apply explicit manifest phase
        if: ${{ !startsWith(inputs.phase, 'rollback-') }}
        env:
          OSMU_DATABASE_URL: ${{ secrets.OSMU_DATABASE_URL }}
          VERIFIED_APP_IMAGE_DIGEST: ${{ steps.app.outputs.image_digest }}
          VERIFIED_APP_COMMIT: ${{ steps.app.outputs.app_commit }}
          ROLLBACK_MANIFEST_PATH: ${{ steps.rollback.outputs.path || steps.prior.outputs.path }}
          ROLLBACK_MANIFEST_SHA256: ${{ steps.rollback.outputs.sha256 || steps.prior.outputs.sha256 }}
          RUNNER_COMMIT: ${{ github.sha }}
          MIGRATION_PHASE: ${{ inputs.phase }}
        run: |
          if [ -n "${ROLLBACK_MANIFEST_PATH:-}" ]; then
            manifest_relative="${ROLLBACK_MANIFEST_PATH#"$RUNNER_TEMP"/}"
            [ "$manifest_relative" != "$ROLLBACK_MANIFEST_PATH" ] \
              || { echo "::error::rollback manifest must be under RUNNER_TEMP"; exit 1; }
            export ROLLBACK_MANIFEST_PATH="/runner-temp/$manifest_relative"
          fi
          docker run --rm \
            -e OSMU_DATABASE_URL \
            -e VERIFIED_APP_IMAGE_DIGEST \
            -e VERIFIED_APP_COMMIT \
            -e ROLLBACK_MANIFEST_PATH \
            -e ROLLBACK_MANIFEST_SHA256 \
            -e RUNNER_COMMIT \
            -v "$SOURCE_DIR/dashboard/db":/db:ro \
            -v "$RUNNER_TEMP":/runner-temp \
            postgres:16 \
            bash /db/run-migrations.sh "$MIGRATION_PHASE"
      - name: Execute approved rollback script
        if: ${{ startsWith(inputs.phase, 'rollback-') }}
        env:
          OSMU_DATABASE_URL: ${{ secrets.OSMU_DATABASE_URL }}
          ROLLBACK_MANIFEST_PATH: ${{ steps.prior.outputs.path }}
          ROLLBACK_MANIFEST_SHA256: ${{ steps.prior.outputs.sha256 }}
          MIGRATION_PHASE: ${{ inputs.phase }}
        run: |
          manifest_relative="${ROLLBACK_MANIFEST_PATH#"$RUNNER_TEMP"/}"
          [ "$manifest_relative" != "$ROLLBACK_MANIFEST_PATH" ] \
            || { echo "::error::rollback manifest must be under RUNNER_TEMP"; exit 1; }
          export ROLLBACK_MANIFEST_PATH="/runner-temp/$manifest_relative"
          docker run --rm \
            -e OSMU_DATABASE_URL \
            -e ROLLBACK_MANIFEST_PATH \
            -e ROLLBACK_MANIFEST_SHA256 \
            -v "$SOURCE_DIR/dashboard/db":/db:ro \
            -v "$RUNNER_TEMP":/runner-temp \
            postgres:16 \
            bash /db/rollback-migration.sh "$MIGRATION_PHASE"
