name: Diagnose host capacity (read-only)

# 왜: 운영 이미지 교체(PR #105, Debian 베이스 + Remotion Chrome, 이미지 약 4.5GB) 전에 배포
#   러너(운영 VM)의 디스크·메모리·CPU 여유를 화면 접속 없이 확인할 길이 없었다.
#
# 안전장치
#   - 읽기 전용이다. 컨테이너·이미지·볼륨을 만들거나 지우지 않는다(prune 금지).
#   - 자격증명·환경변수를 출력하지 않는다. 용량 수치와 이미지 이름·크기만 본다.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: [self-hosted, marketing_runner]
    steps:
      - name: 디스크
        run: df -h / /var/lib/docker "$HOME" 2>/dev/null | sort -u
      - name: 메모리·CPU
        run: |
          free -m
          echo "cpus: $(nproc)"
          uptime
      - name: Docker 사용량
        run: |
          docker system df
          echo "-- 이미지 상위 10 --"
          docker image ls --format '{{.Size}}\t{{.Repository}}:{{.Tag}}' | sort -hr | head -10
      - name: 실행 중 컨테이너 메모리
        run: docker stats --no-stream --format '{{.Name}}\t{{.MemUsage}}\t{{.CPUPerc}}'
      - name: 게이트웨이 마운트 원본 존재 여부
        # PR #93 장애(삭제된 체크아웃 폴더를 붙잡은 bind mount → EACCES 반복 → CPU 100%) 확인용.
        run: |
          for c in $(docker ps --format '{{.Names}}' | grep -E '^openclaw-(gateway|dashboard)-tenant'); do
            docker inspect -f '{{range .Mounts}}{{if eq .Type "bind"}}{{.Source}}{{"\n"}}{{end}}{{end}}' "$c" \
              | grep -v docker.sock | while read -r src; do
                [ -n "$src" ] || continue
                if [ -d "$src" ]; then echo "$c  OK       $src"; else echo "$c  MISSING  $src"; fi
              done
          done
      - name: 게이트웨이 최근 오류 (비밀값 가림)
        run: |
          for c in $(docker ps --format '{{.Names}}' | grep -E '^openclaw-gateway-tenant'); do
            echo "::group::$c"
            docker inspect -f 'started={{.State.StartedAt}} restarts={{.RestartCount}}' "$c"
            docker logs --tail 3000 "$c" 2>&1 | grep -aiE 'EACCES|ENOENT|permission denied' \
              | sed -E 's/(secret|token|password|key)[=:][^ ,;]+/\1=[가림]/Ig' | sort | uniq -c | sort -rn | head -10
            echo "::endgroup::"
          done
