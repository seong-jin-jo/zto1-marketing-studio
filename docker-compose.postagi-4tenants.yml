# 멀티 테넌트 동시 운영 (브랜드/도메인은 fork-local — 슬러그는 예시)
# 기본 인스턴스는 docker-compose.yml.example 그대로 (port 18789/34560 유지)
# 본 파일은 신규 인스턴스를 정의. 같은 image 공유 (build 1회).
#
# 포트 매핑 (예시):
#   tenant2  gateway 18790 / dashboard 34561
#   tenant3  gateway 18792 / dashboard 34563
#   tenant4  gateway 18793 / dashboard 34564
#
# 가동 전 1회 작업:
#   ./bootstrap-postagi-4tenants.sh  (data/config 디렉토리 생성 + templates 복사)
#
# 가동:
#   docker-compose -f docker-compose.postagi-4tenants.yml up -d

# compose 프로젝트 이름을 디렉터리에서 유추하지 않고 못 박는다.
#
# 2026-09-07: 레포 이름이 openclaw-auto 에서 zto1-marketing-studio 로 바뀌자 러너의
# 작업 경로가 함께 바뀌었고, compose 가 새 프로젝트로 인식해 이미 돌고 있는 컨테이너를
# 자기 것으로 못 알아봤다. 그래서 기동 단계가 "container name /openclaw-autoheal is
# already in use" 로 죽었다. 배포 2회 연속 실패의 원인이 이것이다.
# 프로젝트 이름은 실행 중인 자산의 주인을 가리키는 값이라 디렉터리 이름에 딸려 다니면
# 안 된다. 앞으로 레포나 경로를 또 바꿔도 배포는 영향받지 않는다.
name: openclaw-auto

x-gateway-base: &gateway-base
  build:
    context: ./openclaw
    dockerfile: Dockerfile
    network: host
    args:
      OPENCLAW_EXTENSIONS: "threads-publish threads-queue threads-style threads-insights threads-search threads-growth x-publish image-upload instagram-publish card-generator midjourney-image video-generate facebook-publish linkedin-publish youtube-publish naver-blog-publish pinterest-publish tumblr-publish tiktok-publish slack-publish line-publish bluesky-publish discord-publish telegram-publish blog-queue"
      OPENCLAW_INSTALL_BROWSER: "1"
  image: openclaw-auto/gateway:postagi
  network_mode: host
  init: true
  restart: unless-stopped

x-dashboard-base: &dashboard-base
  build:
    context: ./dashboard
    network: host
    # NEXT_PUBLIC_* values are baked into the Next.js client bundle. Requiring the
    # Supabase values here makes a bare manual build fail instead of shipping a
    # login page that can only discover the missing config in the browser.
    args:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?run compose with --env-file .env.osmu}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?run compose with --env-file .env.osmu}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
      BUILD_COMMIT: ${OSMU_BUILD_COMMIT:-unknown}
  image: openclaw-auto/dashboard:postagi
  network_mode: host
  restart: unless-stopped

services:
  # ─────────────── Tenant ───────────────
  openclaw-gateway-tenant2:
    <<: *gateway-base
    container_name: openclaw-gateway-tenant2
    volumes:
      - ./config-tenant2:/home/node/.openclaw
      - ./data-tenant2:/home/node/data
    env_file: .env.tenant2
    environment:
      HOME: /home/node
      TZ: Asia/Seoul
    command: ["node", "dist/index.js", "gateway", "--bind", "loopback", "--port", "18790", "--allow-unconfigured"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18790/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  openclaw-dashboard-tenant2:
    <<: *dashboard-base
    container_name: openclaw-dashboard-tenant2
    volumes:
      - ./data-tenant2:/app/data
      - ./config-tenant2:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
    env_file: .env.tenant2
    environment:
      DATA_DIR: /app/data
      CONFIG_DIR: /app/config
      PORT: "34561"
      HOSTNAME: "0.0.0.0"
      GATEWAY_CONTAINER: openclaw-gateway-tenant2
      GATEWAY_PORT: "18790"
    depends_on:
      - openclaw-gateway-tenant2

  # ─────────────── Tenant ───────────────
  openclaw-gateway-tenant3:
    <<: *gateway-base
    container_name: openclaw-gateway-tenant3
    volumes:
      - ./config-tenant3:/home/node/.openclaw
      - ./data-tenant3:/home/node/data
    env_file: .env.tenant3
    environment:
      HOME: /home/node
      TZ: Asia/Seoul
    command: ["node", "dist/index.js", "gateway", "--bind", "loopback", "--port", "18792", "--allow-unconfigured"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18792/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  openclaw-dashboard-tenant3:
    <<: *dashboard-base
    container_name: openclaw-dashboard-tenant3
    volumes:
      - ./data-tenant3:/app/data
      - ./config-tenant3:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
    env_file: .env.tenant3
    environment:
      DATA_DIR: /app/data
      CONFIG_DIR: /app/config
      PORT: "34563"
      HOSTNAME: "0.0.0.0"
      GATEWAY_CONTAINER: openclaw-gateway-tenant3
      GATEWAY_PORT: "18792"
    depends_on:
      - openclaw-gateway-tenant3

  # ─────────────── tenant (tenant4) ───────────────
  openclaw-gateway-tenant4:
    <<: *gateway-base
    container_name: openclaw-gateway-tenant4
    volumes:
      - ./config-tenant4:/home/node/.openclaw
      - ./data-tenant4:/home/node/data
    env_file: .env.tenant4
    environment:
      HOME: /home/node
      TZ: Asia/Seoul
    command: ["node", "dist/index.js", "gateway", "--bind", "loopback", "--port", "18793", "--allow-unconfigured"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18793/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  openclaw-dashboard-tenant4:
    <<: *dashboard-base
    container_name: openclaw-dashboard-tenant4
    volumes:
      - ./data-tenant4:/app/data
      - ./config-tenant4:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
    env_file: .env.tenant4
    environment:
      DATA_DIR: /app/data
      CONFIG_DIR: /app/config
      PORT: "34564"
      HOSTNAME: "0.0.0.0"
      GATEWAY_CONTAINER: openclaw-gateway-tenant4
      GATEWAY_PORT: "18793"
    depends_on:
      - openclaw-gateway-tenant4

  # ─────────────── tenant1 (auto-added 2026-06-08) ───────────────
  # ⚠️ legacy — OSMU SaaS(openclaw-dashboard-osmu)가 host 포트 18789를 대체 점유한다.
  # 이 게이트웨이도 18789를 바인드하므로 동시 기동 시 포트 충돌 → crash loop(2026-07 실사고: 1861회 재시작).
  # profiles로 기본 `docker compose up`에서 제외. 명시 opt-in 시에만:
  #   docker compose -f docker-compose.postagi-4tenants.yml --profile legacy-tenant1 up -d
  # (opt-in 전 openclaw-dashboard-osmu를 먼저 내려 18789를 비워야 함 — 둘 중 하나만.)
  openclaw-gateway-tenant1:
    <<: *gateway-base
    profiles: ["legacy-tenant1"]
    container_name: openclaw-gateway-tenant1
    volumes:
      - ./config-tenant1:/home/node/.openclaw
      - ./data-tenant1:/home/node/data
    env_file: .env.tenant1
    environment:
      HOME: /home/node
      TZ: Asia/Seoul
    command: ["node", "dist/index.js", "gateway", "--bind", "loopback", "--port", "18789"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18789/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  openclaw-dashboard-tenant1:
    <<: *dashboard-base
    profiles: ["legacy-tenant1"]  # gateway-tenant1과 함께 opt-in(위 주석 참고)
    container_name: openclaw-dashboard-tenant1
    volumes:
      - ./data-tenant1:/app/data
      - ./config-tenant1:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
    env_file: .env.tenant1
    environment:
      DATA_DIR: /app/data
      CONFIG_DIR: /app/config
      PORT: "34560"
      HOSTNAME: "0.0.0.0"
      GATEWAY_CONTAINER: openclaw-gateway-tenant1
      GATEWAY_PORT: "18789"
    depends_on:
      - openclaw-gateway-tenant1

  # ─────────────── OSMU SaaS 대시보드(멀티테넌트, 고객 로그인) ───────────────
  # 공개 URL: openclaw.example.com → localhost:18789(VM)
  # per-service(tenant1/tenant5/..)와 별개. 고객은 /login으로 자기 테넌트 격리. 게이트웨이는 고객별 동적 프로비저닝.
  # ⚠️ .env.osmu 필수(DASHBOARD_AUTH_TOKEN=운영자잠금 + NEXT_PUBLIC_SUPABASE_* + DATABASE_URL + OSMU_SECRET_KEY).
  # ⚠️ 18789는 tenant1 게이트웨이와 같은 포트 → 둘 중 하나만(SaaS 모델이 per-service 대체).
  # autoheal 워치독 — healthcheck가 unhealthy로 표시한 컨테이너를 자동 재시작(L4 재발방지).
  # restart:unless-stopped는 프로세스 종료만 재시작 → 100% CPU hang엔 무력(2026-06-28 장애).
  # AUTOHEAL_CONTAINER_LABEL로 라벨 단 컨테이너만 감시.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: openclaw-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "15"
      AUTOHEAL_START_PERIOD: "60"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  openclaw-dashboard-osmu:
    <<: *dashboard-base
    image: openclaw-auto/dashboard:0.2.0
    container_name: openclaw-dashboard-osmu
    labels:
      autoheal: "true"   # autoheal 워치독이 unhealthy 시 자동 재시작
    volumes:
      # GitHub Actions가 checkout 전 workspace를 비우므로 상대 bind mount를 쓰면 배포마다
      # 고객 queue/config가 삭제된다. Compose project와 무관한 고정 이름 volume에 영속화한다.
      - osmu-data:/app/data
      - osmu-config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
      # claude CLI 폴백 인증(테넌트 Anthropic 키 미등록 시 `claude -p`). 호스트가 사전 인증된 ~/.claude 필요.
      # 테넌트가 자기 API 키 등록 시 이 경로 불필요(HTTP API로 감). 인증 없으면 폴백만 502(고객 키 경로는 정상).
      - ${HOME}/.claude:/root/.claude:ro
      # 이미지·영상 생성기 자격증명. claude 와 같은 방식으로 호스트에서 읽기 전용 마운트한다.
      # 배포에서는 HIGGSFIELD_CREDENTIALS_JSON 시크릿을 이 경로에 렌더한다(deploy-marketing.yml).
      # 배포 VM 은 브라우저가 없어 서버에서 로그인할 수 없기 때문이다.
      # 로컬에서는 `higgsfield auth login` 을 한 번 해 두면 컨테이너가 그것을 읽는다.
      # 없으면 생성 요청이 "생성기가 아직 준비되지 않았습니다"로 정직하게 닫힌다.
      - ${HOME}/.config/higgsfield:/root/.config/higgsfield:ro
    env_file: .env.osmu
    environment:
      DATA_DIR: /app/data
      CONFIG_DIR: /app/config
      DASHBOARD_PORT: "18789"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
    # 헬스체크(L4 재발방지) — hang/DB불가 감지. unhealthy 자동재시작은 autoheal 워치독이 수행
    # (restart:unless-stopped는 프로세스 *종료*만 재시작 → 100% CPU hang엔 무력했음. 2026-06-28 장애).
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:18789/api/health"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 40s

volumes:
  osmu-data:
    name: openclaw-osmu-data
  osmu-config:
    name: openclaw-osmu-config
